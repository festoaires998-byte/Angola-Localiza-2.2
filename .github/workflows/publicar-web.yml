name: Publicar Web (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Exportar Expo Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar asset WASM do expo-sqlite
        run: |
          test -f node_modules/expo-sqlite/web/wa-sqlite/wa-sqlite.wasm
          echo "wa-sqlite.wasm encontrado"

      - name: Exportar aplicação Web
        run: npx expo export --platform web
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
