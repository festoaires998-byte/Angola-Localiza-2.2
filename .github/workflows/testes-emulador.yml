name: Testes no emulador Android

# Compila a app aqui no GitHub (sem a Expo e sem gastar dados de ninguém),
# instala-a num emulador Android e corre os fluxos do Maestro (.maestro/):
# entrar, Mapa com GPS falso no Huambo, modo avião, Moradas. Tira capturas de
# ecrã de cada passo (artefacto "capturas-emulador", JPEG pequenos).
#
# Corre nos PR que mexem na app e quando alguém carrega em "Run workflow".
# Conta de teste: segredos TESTE_EMAIL e TESTE_PASSWORD (cidadão, sem cargos).
# Sem eles, só verifica que a app abre.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.maestro/**'
      - '.github/workflows/testes-emulador.yml'
      - '.github/scripts/testes-emulador.sh'
  workflow_dispatch:

concurrency:
  group: testes-emulador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulador:
    name: Compilar e testar no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TESTE_EMAIL: ${{ secrets.TESTE_EMAIL }}
      TESTE_PASSWORD: ${{ secrets.TESTE_PASSWORD }}
      APK: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - name: Início
        run: echo "T_INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # O build do Android e o emulador precisam de muito disco.
      - name: Libertar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Guarda as dependências do Gradle entre execuções (a 2.ª vez é mais rápida).
      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      # Os mesmos valores públicos do perfil "preview" (eas.json): URL e chave anon.
      - name: Configuração do Supabase (a mesma do APK de teste)
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$(jq -r '.build.preview.env.EXPO_PUBLIC_SUPABASE_URL' eas.json)" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.build.preview.env.EXPO_PUBLIC_SUPABASE_ANON_KEY' eas.json)" >> "$GITHUB_ENV"

      - name: Preparar o projeto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compilar o APK (só x86_64, a arquitetura do emulador)
        env:
          NODE_ENV: production
        run: |
          echo "T_BUILD=$(date +%s)" >> "$GITHUB_ENV"
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -PreactNativeArchitectures=x86_64 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
          ls -la app/build/outputs/apk/release/
          echo "T_BUILD_FIM=$(date +%s)" >> "$GITHUB_ENV"

      - name: Instalar o Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Ligar a aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + testes (Maestro)
        id: testes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: echo "T_TESTES=$(date +%s)" >> "$GITHUB_ENV" && maestro --version && bash .github/scripts/testes-emulador.sh "$APK"

      - name: Capturas de ecrã pequenas (JPEG)
        if: always()
        run: |
          mkdir -p capturas-jpg
          for f in capturas/*.png; do
            [ -e "$f" ] || continue
            convert "$f" -resize 360x -quality 70 "capturas-jpg/$(basename "${f%.png}").jpg"
          done
          du -sh capturas-jpg || true

      - name: Guardar as capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-emulador
          path: capturas-jpg/
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar o relatório do Maestro (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-maestro
          path: relatorio/
          retention-days: 3
          if-no-files-found: ignore

      - name: Resumo
        if: always()
        run: |
          agora=$(date +%s)
          minutos() { if [ -n "${1:-}" ] && [ -n "${2:-}" ]; then echo "$(( ($2 - $1 + 59) / 60 )) min"; else echo "—"; fi; }
          tamanho="—"
          [ -f "$APK" ] && tamanho="$(python3 -c "import os; print(f'{os.path.getsize(\"$APK\")/1048576:.1f} MB')")"
          {
            echo "## Testes no emulador Android"
            echo ""
            if [ -f relatorio/passos.md ]; then
              echo "| Passo | Resultado | Tempo |"
              echo "| --- | --- | --- |"
              cat relatorio/passos.md
              echo ""
            fi
            echo "| | |"
            echo "| --- | --- |"
            echo "| Preparar (dependências, prebuild) | $(minutos "${T_INICIO:-}" "${T_BUILD:-}") |"
            echo "| Compilar o APK x86_64 | $(minutos "${T_BUILD:-}" "${T_BUILD_FIM:-}") (APK: $tamanho) |"
            echo "| Emulador + testes | $(minutos "${T_TESTES:-}" "$agora") |"
            echo "| **Total (minutos do GitHub gastos)** | **$(minutos "${T_INICIO:-}" "$agora")** |"
            echo ""
            echo "Capturas: artefacto **capturas-emulador** (em baixo, nesta página)."
          } >> "$GITHUB_STEP_SUMMARY"
