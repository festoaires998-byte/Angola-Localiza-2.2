appId: ao.angolalocaliza.app
name: Sem rede (modo avião)
---
# O script liga o modo avião antes deste fluxo. Fecha e volta a abrir a app,
# como quem a abre sem rede.
- stopApp
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sem rede: a mostrar o que está neste telemóvel"
    timeout: 60000
- assertNotVisible: "O mapa ainda não está neste telemóvel.*"
- extendedWaitUntil:
    visible: "Média de .* leituras do GPS com menos de ±10 m\\."
    timeout: 90000
- assertVisible: "5FVQ6PFQ\\+HJ9"
- assertVisible: "AO-HUA-MNFQR6JW(-[0-9]+)?-90"
- takeScreenshot: capturas/06_mapa_sem_rede
- swipe:
    start: 50%, 85%
    end: 50%, 60%
- assertVisible: "Confirmado"
- assertVisible: "Sem rede: confirmado pelo servidor a .*"
- assertVisible: "Huambo"
- takeScreenshot: capturas/07_mapa_sem_rede_detalhe

- tapOn: "Moradas"
- extendedWaitUntil:
    visible: "As minhas moradas"
    timeout: 30000
- assertVisible: "Sem rede: a mostrar o que está neste telemóvel.*"
- takeScreenshot: capturas/08_moradas_sem_rede
