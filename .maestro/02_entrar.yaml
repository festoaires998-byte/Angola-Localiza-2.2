appId: ao.angolalocaliza.app
name: Entrar com a conta de teste
---
# TESTE_EMAIL e TESTE_PASSWORD vêm dos segredos do GitHub (-e na linha de comandos).
- tapOn:
    id: "campo-email"
- inputText: ${TESTE_EMAIL}
- hideKeyboard
- tapOn:
    id: "campo-palavra-passe"
- inputText: ${TESTE_PASSWORD}
- hideKeyboard
- tapOn: "Entrar"
- extendedWaitUntil:
    visible: "Onde estou"
    timeout: 60000
